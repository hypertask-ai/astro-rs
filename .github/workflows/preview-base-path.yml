name: Preview base path

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: preview-base-path-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview-base-path:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_BASE_PATH: /ratstack
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 24.18.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Enable corepack pnpm
        run: corepack enable && corepack prepare pnpm@11.3.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the preview
        run: pnpm build
      - name: Audit every built preview link and asset
        run: node scripts/check-base-path.ts apps/web/dist/client
