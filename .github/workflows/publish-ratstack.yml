name: Publish hypertask.ai/ratstack

on:
  push:
    branches: [site]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-ratstack
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the new site at hypertask.ai/ratstack
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SITE_BASE_PATH: /ratstack
    steps:
      - name: Require the Cloudflare deploy secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          missing=""
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            missing="${missing} CLOUDFLARE_API_TOKEN"
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            missing="${missing} CLOUDFLARE_ACCOUNT_ID"
          fi
          if [ -n "${missing}" ]; then
            echo "::error::Missing repository secret(s):${missing}. The publish cannot authenticate to Cloudflare without them. Fix: add them under Settings, Secrets and variables, Actions."
            exit 1
          fi
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Use Node.js 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - name: Enable corepack pnpm
        run: corepack enable && corepack prepare pnpm@11.3.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Record the old site answer before the deploy
        run: node scripts/publish-smoke.ts record .rat/publish/baseline.json
      - name: Build the site under /ratstack
        run: pnpm build
      - name: Check every same-site URL stays under /ratstack
        run: node scripts/check-base-path.ts apps/web/dist/client
      - name: Deploy the hypertask-ratstack Worker with its one route
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @hypertask-site/infra exec alchemy deploy --stage prod --yes
      - name: Smoke check the live addresses
        run: node scripts/publish-smoke.ts check .rat/publish/baseline.json apps/web/dist/client "The fastest project board — Hypertask"
