name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      TURBO_API: ${{ vars.TURBO_API }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
      TURBO_CACHE: local:rw,remote:rw
      TURBO_RUN_SUMMARY: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js 24.18.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Enable corepack pnpm
        run: corepack enable && corepack prepare pnpm@11.3.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Fetch pinned source objects
        run: pnpm sources:fetch
      - name: Check and test
        # 6882060, 4 cores/16 GB: median N1=479s, N2=265s, N4=271s; N2 worst test=39.13% of budget.
        run: pnpm turbo run check test build --concurrency=2
      - name: Measure built site
        run: |
          python3 - <<'PY'
          import gzip
          import os
          root = "apps/web/dist"
          if not os.path.isdir(root):
              raise SystemExit(f"missing {root}")
          files = []
          total = 0
          scripts = []
          worker_raw_bytes = 0
          worker_gzip_bytes = 0
          for dirpath, _, names in os.walk(root):
              for name in names:
                  path = os.path.join(dirpath, name)
                  size = os.path.getsize(path)
                  total += size
                  files.append((size, path))
                  if name.endswith((".js", ".mjs")) and os.path.commonpath([path, os.path.join(root, "server")]) == os.path.join(root, "server"):
                      with open(path, "rb") as source:
                          raw = source.read()
                      compressed_size = len(gzip.compress(raw, mtime=0))
                      scripts.append((compressed_size, size, path))
                      worker_raw_bytes += size
                      worker_gzip_bytes += compressed_size
          files.sort(reverse=True)
          scripts.sort(reverse=True)
          print(f"SITE_BYTES {total}")
          if not scripts:
              raise SystemExit("no worker scripts in apps/web/dist/server")
          print(f"WORKER_SCRIPT_BYTES {worker_raw_bytes}")
          print(f"WORKER_GZIP_BYTES {worker_gzip_bytes}")
          print("FREE_PLAN_UNCOMPRESSED_LIMIT_BYTES 67108864")
          print("LIMIT_SOURCE https://developers.cloudflare.com/workers/platform/limits/#worker-size")
          for gzip_bytes, raw_bytes, path in scripts:
              print(f"WORKER_MODULE {raw_bytes} {gzip_bytes} {path}")
          for size, path in files[:30]:
              print(f"{size} {path}")
          if worker_raw_bytes > 67108864:
              raise SystemExit("worker exceeds Cloudflare Free uncompressed size limit")
          PY
      - name: Upload Turbo run summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turbo-runs
          path: .turbo/runs/*.json
          include-hidden-files: true
          if-no-files-found: ignore
